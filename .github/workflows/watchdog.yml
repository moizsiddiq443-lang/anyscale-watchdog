name: anyscale-watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: watchdog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MARIE_KEY: ${{ secrets.MARIE_KEY }}
      JOSH_KEY: ${{ secrets.JOSH_KEY }}
      KER_KEY: ${{ secrets.KER_KEY }}
      CLAZ_KEY: ${{ secrets.CLAZ_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install anyscale CLI (for service deploy)
        run: pip install anyscale
      - name: Run watchdog pass
        run: node watchdog-gha.mjs